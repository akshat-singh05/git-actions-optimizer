<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GitHub Actions Performance Optimizer</title>
<meta name="description" content="Dashboard of the GitHub Actions Performance Optimizer: pipeline stages, what-if scoring, evidence." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f4f6fa; --surface: #ffffff; --surface2: #f1f4f9; --border: #dbe1ea; --text: #1a2333; --text-dim: #5a6578;
  --accent: #1f4fb4; --accent-dim: #e4ecfb; --green: #15803d; --green-dim: #dcfce7; --red: #b42318; --red-dim: #fee4e2;
  --amber: #b45309; --amber-dim: #fef0c7; --cyan: #0e7490; --radius: 8px; --shadow: 0 1px 2px rgba(16,24,40,.05);
  --mono: 'JetBrains Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
}
html, body { height: 100%; }
body { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text);
  line-height: 1.55; overflow: hidden; -webkit-font-smoothing: antialiased; }
.app { height: 100vh; display: grid; grid-template-rows: auto minmax(0, 1fr); }
code { font-family: var(--mono); font-size: .92em; background: var(--surface2); padding: 1px 5px; border-radius: 4px; }

/* header */
.header { background: var(--surface); border-bottom: 1px solid var(--border); border-top: 3px solid var(--accent); padding: 12px 28px; }
.header-inner { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand h1 { font-size: 16px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2; }
.brand .tagline { font-size: 12px; color: var(--text-dim); }
.repo-switch { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-dim); }
.repo-switch select { font: inherit; font-size: 13px; font-weight: 600; color: var(--text); background: var(--surface); border: 1px solid var(--border);
  border-radius: 6px; padding: 7px 28px 7px 10px; min-width: 280px; cursor: pointer; }
.repo-switch select:focus { outline: 2px solid var(--accent-dim); border-color: var(--accent); }
.chip { font-family: var(--mono); font-size: 11px; padding: 3px 9px; border-radius: 999px; background: var(--surface2); color: var(--text-dim); white-space: nowrap; }
.chip.ok { background: var(--green-dim); color: var(--green); } .chip.warn { background: var(--amber-dim); color: var(--amber); } .chip.err { background: var(--red-dim); color: var(--red); }
.team { font-size: 12px; color: var(--text-dim); text-align: right; line-height: 1.5; }
.team strong { color: var(--text); font-weight: 600; }

/* layout */
.main { min-height: 0; overflow: hidden; }
.layout { display: grid; grid-template-columns: 248px minmax(0, 1fr); height: 100%; }
.sidebar { background: var(--surface); border-right: 1px solid var(--border); padding: 10px; overflow-y: auto; min-height: 0; }
.nav-heading { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .6px; color: var(--text-dim); padding: 12px 10px 6px; }
.nav-heading:first-child { padding-top: 4px; }
.nav-link { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 6px; font-size: 13px; color: var(--text);
  text-decoration: none; border-left: 3px solid transparent; }
.nav-link:hover { background: var(--surface2); }
.nav-link.active { background: var(--accent-dim); color: var(--accent); font-weight: 600; border-left-color: var(--accent); }
.nav-num { width: 22px; height: 22px; border-radius: 5px; flex-shrink: 0; background: var(--surface2); color: var(--text-dim); font-size: 11px;
  font-weight: 700; display: flex; align-items: center; justify-content: center; }
.nav-link.active .nav-num { background: var(--accent); color: #fff; }
.page { min-width: 0; min-height: 0; overflow-y: auto; padding: 22px 28px 40px; }
.page-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
.page-head h2 { font-size: 20px; font-weight: 700; letter-spacing: -.01em; flex: 1; }
.step-num { background: var(--accent); color: #fff; font-size: 12px; font-weight: 700; width: 26px; height: 26px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.badge { font-size: 11px; padding: 3px 10px; border-radius: 999px; font-family: var(--mono); font-weight: 500; background: var(--accent-dim); color: var(--accent); }
.badge.pass { background: var(--green-dim); color: var(--green); } .badge.fail { background: var(--red-dim); color: var(--red); }

/* panels, cards, tables */
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; min-width: 0; margin-bottom: 14px; overflow-x: auto; }
.panel h3 { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
.hint { font-size: 11.5px; color: var(--text-dim); margin-bottom: 10px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.grid2 > .panel { margin-bottom: 0; } .grid2 { margin-bottom: 14px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 14px; }
@media (min-width: 1300px) { .kpis { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
.kpi .label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .6px; color: var(--text-dim); margin-bottom: 4px; }
.kpi .value { font-size: 25px; font-weight: 700; font-family: var(--mono); letter-spacing: -.02em; }
.kpi .sub { font-size: 12px; color: var(--text-dim); margin-top: 3px; }
.v-accent { color: var(--accent); } .v-green { color: var(--green); } .v-cyan { color: var(--cyan); } .v-amber { color: var(--amber); } .v-red { color: var(--red); }
.context-bar { display: flex; flex-wrap: wrap; gap: 6px 26px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 11px 16px; margin-bottom: 14px; box-shadow: var(--shadow); font-size: 12px; color: var(--text-dim); }
.context-bar b { color: var(--text); font-weight: 600; font-family: var(--mono); font-size: 12px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; border: 1px solid var(--border); }
th { text-align: left; padding: 7px 11px; background: var(--surface2); color: var(--text-dim); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; white-space: nowrap; }
td { padding: 7px 11px; border-top: 1px solid var(--border); font-family: var(--mono); font-size: 12px; vertical-align: top; }
tr:hover td { background: #f8fafc; }
.tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-family: var(--mono); font-weight: 500; }
.tag.green { background: var(--green-dim); color: var(--green); } .tag.amber { background: var(--amber-dim); color: var(--amber); }
.tag.red { background: var(--red-dim); color: var(--red); } .tag.blue { background: var(--accent-dim); color: var(--accent); } .tag.grey { background: var(--surface2); color: var(--text-dim); }
.kv { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; padding: 3px 0; }
.kv .k { color: var(--text-dim); } .kv .v { font-family: var(--mono); text-align: right; word-break: break-all; }
.compact { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 12px 14px; }
.compact h4 { font-size: 13px; font-weight: 600; margin-bottom: 6px; }
.note { margin: 12px 0; padding: 11px 14px; background: var(--amber-dim); border: 1px solid #f5d98a; border-radius: 6px; font-size: 12px; color: #5c3b06; line-height: 1.65; }
.note.info { background: var(--accent-dim); border-color: #c4d4f5; color: #17336f; }
.pill { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .4px; padding: 1px 7px; border-radius: 999px; margin-right: 6px; }
.pill.est { background: var(--amber-dim); color: var(--amber); } .pill.meas { background: var(--green-dim); color: var(--green); }
.list { list-style: none; font-size: 12.5px; line-height: 1.6; } .list li { padding: 5px 0; border-top: 1px solid var(--border); } .list li:first-child { border-top: 0; }
.btn { font: inherit; font-size: 13px; font-weight: 600; padding: 7px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; } .btn.primary:hover { color: #fff; opacity: .92; }
.btn.small { padding: 4px 10px; font-size: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.fchip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 12px; background: var(--accent-dim); color: var(--accent); padding: 3px 4px 3px 9px; border-radius: 999px; }
.fchip button { border: 0; background: transparent; color: inherit; cursor: pointer; font-size: 14px; line-height: 1; padding: 0 5px; }
input[type=search], input[type=text] { font: inherit; font-size: 13px; padding: 8px 11px; border: 1px solid var(--border); border-radius: 6px; width: 100%; background: var(--surface); color: var(--text); }
input:focus { outline: 2px solid var(--accent-dim); border-color: var(--accent); }
.filelist { max-height: 220px; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px; margin-top: 8px; }
.filelist div { font-family: var(--mono); font-size: 12px; padding: 5px 10px; border-top: 1px solid var(--border); cursor: pointer; }
.filelist div:first-child { border-top: 0; } .filelist div:hover { background: var(--accent-dim); }

/* bars + gantt */
.hbar { display: grid; grid-template-columns: 190px minmax(0, 1fr) 70px; align-items: center; gap: 10px; margin-bottom: 7px; font-size: 12px; }
.hbar .name { font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar .track { height: 12px; background: var(--surface2); border-radius: 3px; overflow: hidden; position: relative; }
.hbar .fill { height: 100%; border-radius: 3px; background: var(--accent); } .hbar .fill.g { background: #22a055; } .hbar .fill.a { background: #d9831f; } .hbar .fill.r { background: #d1432f; }
.hbar .mark { position: absolute; top: -2px; bottom: -2px; width: 2px; background: #1a2333; }
.hbar .num { font-family: var(--mono); text-align: right; color: var(--text-dim); }
.g-row { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 10px; align-items: center; margin-bottom: 6px; font-size: 12px; }
.g-row .name { font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.g-lane { position: relative; height: 18px; background: var(--surface2); border-radius: 3px; }
.g-bar { position: absolute; top: 0; height: 100%; background: var(--accent); border-radius: 3px; min-width: 2px; color: #fff; font-size: 10px; font-family: var(--mono); display: flex; align-items: center; padding-left: 5px; overflow: hidden; white-space: nowrap; }
.g-bar.hot { background: #d9831f; }
.g-axis { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 10px; margin-top: 4px; font-size: 10px; color: var(--text-dim); font-family: var(--mono); }
.g-axis div:last-child { display: flex; justify-content: space-between; }

/* dag svg */
.dag { width: 100%; overflow-x: auto; }
.dag svg { display: block; margin: 0 auto; }
.dag .node rect { fill: var(--accent-dim); stroke: var(--accent); stroke-width: 1.2; }
.dag .node.hot rect { fill: #ffe9c4; stroke: #d9831f; } .dag .node.cold rect { fill: var(--surface2); stroke: #aab4c5; }
.dag .node.r rect { fill: #fbd5cf; stroke: #d1432f; } .dag .node.a rect { fill: #fde8c5; stroke: #d9831f; } .dag .node.g rect { fill: #d4f1de; stroke: #22a055; }
.dag text { font-family: var(--mono); font-size: 11px; fill: var(--text); }
.dag .sub { font-size: 9.5px; fill: var(--text-dim); }
.dag path { fill: none; stroke: #8a97ad; stroke-width: 1.3; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11px; color: var(--text-dim); margin-top: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

/* graph drawings */
.graphbox { border: 1px solid var(--border); border-radius: 6px; background: #fff; overflow: hidden; position: relative; }
.graphbox svg { display: block; width: 100%; height: calc(100vh - 300px); min-height: 360px; cursor: grab; touch-action: none; }
.graphbox svg:active { cursor: grabbing; }
.graphbox .gedge { fill: none; stroke: #9aa7bb; stroke-width: 1; opacity: .75; }
.graphbox .gnode text { font-family: var(--mono); font-size: 11px; fill: var(--text); pointer-events: none; }
.graphbox .gnode circle { stroke: #fff; stroke-width: 1.5; }
.graphbox .gedge.dep { stroke: #1f4fb4; stroke-width: 1.8; opacity: .9; }
.zoomhint { position: absolute; right: 8px; top: 6px; font-size: 10.5px; color: var(--text-dim); background: rgba(255,255,255,.85); padding: 2px 6px; border-radius: 4px; }
.legend i.dot { border-radius: 50%; }
/* code / diff / markdown */
pre.code { font-family: var(--mono); font-size: 12px; background: #f8fafc; border: 1px solid var(--border); border-radius: 6px; padding: 12px 14px; overflow: auto; max-height: 520px; line-height: 1.55; white-space: pre; }
.diff-add { color: #116329; background: #e6f4ea; } .diff-del { color: #a4161a; background: #fdecea; } .diff-hdr { color: #1f4fb4; }
.md { font-size: 14px; max-width: 980px; } .md h1 { font-size: 22px; margin: 18px 0 8px; } .md h2 { font-size: 17px; margin: 22px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
.md h3 { font-size: 15px; margin: 16px 0 6px; } .md p { margin: 8px 0; } .md ul, .md ol { margin: 8px 0 8px 22px; } .md li { margin: 3px 0; }
.md table { display: block; overflow-x: auto; } .md blockquote { border-left: 3px solid var(--border); padding-left: 12px; color: var(--text-dim); margin: 8px 0; }
.md pre { margin: 8px 0; } .md a { color: var(--accent); }
.sel { font: inherit; font-size: 13px; padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); width: 100%; }
.docs-layout { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 18px; }
.docs-list { display: flex; flex-direction: column; gap: 2px; max-height: calc(100vh - 210px); overflow-y: auto; }
.docs-list a { font-size: 12.5px; padding: 6px 10px; border-radius: 5px; color: var(--text); text-decoration: none; font-family: var(--mono); }
.docs-list a:hover { background: var(--surface2); } .docs-list a.active { background: var(--accent-dim); color: var(--accent); font-weight: 600; }
.pager { display: flex; justify-content: space-between; margin-top: 26px; padding-top: 14px; border-top: 1px solid var(--border); }
.pager a { font-size: 13px; font-weight: 600; color: var(--accent); text-decoration: none; padding: 8px 14px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); }
.pager a:hover { border-color: var(--accent); }
.footer { text-align: center; padding: 26px 0 0; color: var(--text-dim); font-size: 12px; }

/* progress */
.loading { max-width: 560px; margin: 8vh auto; padding: 0 20px; }
.loading h2 { font-size: 18px; margin-bottom: 4px; } .loading .hint { margin-bottom: 18px; }
.bar { height: 8px; background: var(--surface2); border-radius: 999px; overflow: hidden; margin: 10px 0 16px; }
.bar > div { height: 100%; background: var(--accent); transition: width .4s ease; }
.stages { list-style: none; font-size: 13px; }
.stages li { display: flex; align-items: center; gap: 10px; padding: 5px 0; color: var(--text-dim); }
.stages li.done { color: var(--text); } .stages li.now { color: var(--accent); font-weight: 600; }
.stages .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--border); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #fff; }
.stages li.done .dot { background: var(--green); border-color: var(--green); } .stages li.now .dot { border-color: var(--accent); border-top-color: transparent; animation: spin .8s linear infinite; }
.stages .sec { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--text-dim); }
@keyframes spin { to { transform: rotate(360deg); } }
.center-card { max-width: 820px; margin: 6vh auto; }

@media (max-width: 900px) {
  body { overflow: auto; } .app { height: auto; } .layout { grid-template-columns: 1fr; height: auto; }
  .sidebar { display: flex; flex-wrap: wrap; gap: 4px; border-right: 0; border-bottom: 1px solid var(--border); } .nav-heading { width: 100%; }
  .page { overflow: visible; padding: 16px; } .grid2, .docs-layout { grid-template-columns: 1fr; } .header-inner { flex-direction: column; align-items: flex-start; }
  .team { text-align: left; } .repo-switch select { min-width: 0; width: 100%; }
}
</style>
</head>
<body>
<div class="app">
  <div class="header"><div class="header-inner">
    <div class="brand">
      <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#1f4fb4"/>
        <circle cx="9" cy="16" r="2.6" fill="#fff"/><circle cx="23" cy="9" r="2.6" fill="#fff"/><circle cx="23" cy="23" r="2.6" fill="#fff"/>
        <path d="M11.4 15.2 20.6 10M11.4 16.8 20.6 22" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
      <div><h1>GitHub Actions Performance Optimizer</h1><div class="tagline">Dependency-aware, prediction-driven CI/CD scheduling</div></div>
    </div>
    <div class="repo-switch"><label for="repoSelect">Repository</label><select id="repoSelect" aria-label="Repository"></select><span class="chip" id="repoState"></span></div>
    <div class="team"><strong>Akshat Singh</strong> 23BKT0005 &middot; <strong>Aditya Choubey</strong> 23BCE2274<br>B.Tech CSE capstone (BCSE497J), VIT</div>
  </div></div>
  <div class="main" id="content"></div>
</div>

<script>
'use strict';
const API = '/api/v1/dashboard';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const S = { repo: new URLSearchParams(location.search).get('repo'), result: null, repos: [], whatif: { files: [], data: null }, seq: 0, loadSeq: 0 };

const STEPS = [
  [1, 'repository', 'Repository analysis'], [2, 'source', 'Source code graph'], [3, 'ci', 'CI/CD graph'], [4, 'fusion', 'Graph fusion'],
  [5, 'impact', 'Impact analysis'], [6, 'features', 'Feature extraction'], [7, 'models', 'Models and predictions'],
  [8, 'schedule', 'DAG-aware scheduling'], [9, 'safety', 'DAG safety verification'], [10, 'workflow', 'Original vs proposed workflow'],
  [11, 'summary', 'Final summary'],
];

async function api(path, opts) {
  const r = await fetch(API + path, opts);
  if (!r.ok) { let d = ''; try { d = (await r.json()).detail; } catch (e) { /* not JSON */ } throw new Error(d || ('HTTP ' + r.status)); }
  return r.headers.get('content-type').includes('json') ? r.json() : r.text();
}
const fmt = (v, d = 1) => (v === null || v === undefined || Number.isNaN(v)) ? 'n/a' : (typeof v === 'number' ? (Number.isInteger(v) ? String(v) : v.toFixed(d)) : esc(v));
const pct = (v) => (v === null || v === undefined) ? 'n/a' : (v * 100).toFixed(1) + '%';
const riskClass = (p) => p > 0.5 ? 'r' : p > 0.2 ? 'a' : 'g';
/* the failure score is shown as a probability only where the model beat the job's own base rate on unseen rows (step7_models.score_display) */
const scoreIsProb = () => !!(S.result && S.result.step7_models && S.result.step7_models.score_display && S.result.step7_models.score_display.as_probability);
const scoreWord = () => scoreIsProb() ? 'P(fail)' : 'risk score';
const tagFor = (p) => (p === null || p === undefined) ? '<span class="tag grey">n/a</span>' : `<span class="tag ${p > 0.5 ? 'red' : p > 0.2 ? 'amber' : 'green'}">${p.toFixed(3)}</span>`;

/* ------------------------------------------------------------------ repositories + running */
async function init() {
  const sel = $('repoSelect');
  try {
    const info = await api('/repos');
    S.repos = info.repos;
    S.repo = S.repo || info.default || (info.repos[0] && info.repos[0].repo);
    sel.innerHTML = info.repos.map(r => `<option value="${esc(r.repo)}"${r.repo === S.repo ? ' selected' : ''}>${esc(r.repo)} - ${r.runs} runs${r.declined ? ' (declines)' : r.ready ? ' (ready)' : ''}</option>`).join('');
    sel.onchange = () => { S.repo = sel.value; const q = new URLSearchParams(location.search); q.set('repo', S.repo); history.replaceState(null, '', '?' + q + location.hash); S.whatif = { files: [], data: null }; load(); };
  } catch (e) { setChip('error', 'err'); $('content').innerHTML = `<div class="center-card panel"><h3>The dashboard API is not reachable</h3><p class="hint">${esc(e.message)}. Start it with <code>gha-optimizer dashboard</code>.</p></div>`; return; }
  load();
}
function setChip(text, cls) { const c = $('repoState'); c.textContent = text; c.className = 'chip ' + (cls || ''); }

async function load() {
  const my = ++S.loadSeq;
  window.onhashchange = null;
  S.result = null;
  setChip('starting', 'warn');
  let st;
  try { st = await api(`/run?repo=${encodeURIComponent(S.repo)}`, { method: 'POST' }); } catch (e) { return showError(e.message); }
  while (st.state === 'queued' || st.state === 'running') {
    if (my !== S.loadSeq) return;
    renderProgress(st);
    await new Promise(r => setTimeout(r, 600));

  try { measured = await api('/measured?repo=' + encodeURIComponent(S.repo)); } catch (e) { /* none */ }
  return `<div class="note"><span class="pill est">ESTIMATED</span> The four boxes below are derived from predicted durations; none is a measured execution. The default plan keeps the workflow's job structure, so they show 0% unless an opt-in lever is used.</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px">
    ${c('Wall-clock (estimated)', [['Baseline', s.baseline_wall_clock + 's'], ['Proposed', s.optimized_wall_clock + 's'], ['Saved', (s.time_saved_pct > 0 ? '+' : '') + s.time_saved_pct + '%']])}
    ${c('Cost (estimated)', [['Baseline', '$' + s.baseline_cost], ['Proposed', '$' + s.optimized_cost], ['Change', (s.cost_saved_pct > 0 ? '+' : '') + s.cost_saved_pct + '%']])}
    ${c('Energy (estimated)', [['Baseline', s.baseline_energy + ' Wh'], ['Proposed', s.optimized_energy + ' Wh'], ['Change', (s.energy_saved_pct > 0 ? '+' : '') + s.energy_saved_pct + '%']])}
    ${c('CO&#8322; (estimated)', [['Baseline', s.baseline_co2 + ' g'], ['Proposed', s.optimized_co2 + ' g'], ['Change', (s.co2_saved_pct > 0 ? '+' : '') + s.co2_saved_pct + '%']])}</div>
    ${measuredPanels(measured)}`;
}
function stripChart(runs, key, unit) {
  const vals = runs.map(r => r[key]), lo = Math.min(...vals) - 10, hi = Math.max(...vals) + 10, W = 900, H = 150, x = (v) => 110 + (v - lo) / (hi - lo) * (W - 140);
  const rows = [['A', 'Original', '#64748b', 45], ['B', 'Proposed', '#0f766e', 105]];
  const med = (a) => { const s2 = a.slice().sort((p, q) => p - q), m = Math.floor(s2.length / 2); return s2.length % 2 ? s2[m] : (s2[m - 1] + s2[m]) / 2; };
  const ticks = Array.from({ length: 5 }, (_, i) => lo + (hi - lo) * i / 4);
  return `<div class="graphbox"><svg viewBox="0 0 ${W} ${H}" style="height:auto;min-height:0;cursor:default">
    ${ticks.map(t => `<line x1="${x(t)}" x2="${x(t)}" y1="20" y2="130" stroke="#e3e8ef"/><text x="${x(t)}" y="146" font-size="11" text-anchor="middle" fill="#5a6578" font-family="monospace">${Math.round(t)}${unit}</text>`).join('')}
    ${rows.map(([arm, label, color, y]) => { const v = runs.filter(r => r.arm === arm).map(r => r[key]); const m = med(v);
      return `<text x="100" y="${y + 4}" text-anchor="end" font-size="12" fill="#1a2333">${label}</text><line x1="${x(m)}" x2="${x(m)}" y1="${y - 20}" y2="${y + 20}" stroke="${color}" stroke-width="3"/>
        ${v.map(q => `<circle cx="${x(q)}" cy="${y}" r="6" fill="${color}" fill-opacity=".55" stroke="#fff"><title>${q}${unit}</title></circle>`).join('')}
        <text x="${x(m) + 6}" y="${y - 22}" font-size="11" fill="${color}" font-family="monospace">median ${m}${unit}</text>`; }).join('')}</svg></div>`;
}
function measuredPanels(m) {
  if (!m.experiments || !m.experiments.length) return `<div class="panel" style="margin-top:14px"><h3>Measured evidence</h3>
    <p class="hint">No executed benchmark exists for ${esc(S.repo)}: nobody has run its original and proposed workflows on GitHub Actions, so nothing here is MEASURED. The only executed benchmarks of this project are on <b>akshat-singh05/git-actions-optimizer</b> (select it in the repository menu). For the history of this repository, the replay of safe gate relaxation (<span class="pill meas">MEASURED on history</span>) is on the <a href="#evidence">Evidence</a> page.</p></div>`;
  return m.experiments.map(e => {
    const sm = e.summary, cp = sm.critical_path_s, bl = sm.billable_job_s, A = cp.A_original, B = cp.B_proposed, faster = cp.median_diff_B_minus_A_s < 0 && cp.permutation_p < 0.05;
    return `<div class="panel" style="margin-top:14px"><h3>MEASURED: ${esc(e.title)} <span class="pill meas">MEASURED</span></h3>
      <div class="hint">Real GitHub Actions runs on ${esc(S.repo)}: ${sm.n_measured_runs} measured runs, ${A.n} per arm, order alternated, one warm-up run per arm not counted. Wall-clock critical path = first job start to last job end.</div>
      <div class="kpis"><div class="kpi"><div class="label">Original, median</div><div class="value">${A.median}s</div><div class="sub">min ${A.min} / max ${A.max}</div></div>
        <div class="kpi"><div class="label">Proposed, median</div><div class="value ${faster ? 'v-green' : ''}">${B.median}s</div><div class="sub">min ${B.min} / max ${B.max}</div></div>
        <div class="kpi"><div class="label">Difference</div><div class="value ${faster ? 'v-green' : 'v-amber'}">${cp.median_diff_pct > 0 ? '+' : ''}${cp.median_diff_pct}%</div><div class="sub">${cp.median_diff_B_minus_A_s}s median</div></div>
        <div class="kpi"><div class="label">Permutation p</div><div class="value ${cp.permutation_p < 0.05 ? 'v-green' : 'v-amber'}">${cp.permutation_p}</div><div class="sub">${cp.permutation_p < 0.05 ? 'significant at 0.05' : 'no detectable difference'}</div></div>
        <div class="kpi"><div class="label">Billable job time</div><div class="value v-amber">${bl.median_diff_pct > 0 ? '+' : ''}${bl.median_diff_pct}%</div><div class="sub">p = ${bl.permutation_p}${bl.permutation_p >= 0.05 ? ' (not significant)' : ''}</div></div></div>
      <div class="hint" style="margin-top:6px">Critical path of every measured run (each dot is one run)</div>${stripChart(e.runs, 'critical_path_s', 's')}
      <div class="hint" style="margin-top:12px">${sm.needs_respected_every_run || sm.needs_ok_all ? '&#10003; every <code>needs</code> relationship still in the proposed file was respected in every run. ' : ''}${sm.all_success ? '&#10003; every run and every job succeeded. ' : ''}${sm.job_median_s ? 'Median job time (s), original / proposed: ' + Object.keys(sm.job_median_s.A_original).map(j => '<code>' + esc(j) + '</code> ' + sm.job_median_s.A_original[j] + ' / ' + sm.job_median_s.B_proposed[j]).join('; ') + '. ' : ''}${sm.same_steps_and_conclusions_everywhere ? '&#10003; identical steps and conclusions in all runs. ' : ''}${sm.relaxed_arm_test_overlaps_lint_in_every_run ? '&#10003; in the proposed arm <code>test</code> started while <code>lint</code> was running, in every run; in the original arm never.' : ''}</div>
      ${table(['Arm', 'Round', 'Run (GitHub)', 'Critical path', 'Billable job time'], e.runs.slice().sort((p, q) => p.round - q.round || p.arm.localeCompare(q.arm)).map(r => [r.arm === 'A' ? 'original' : 'proposed', r.round, `<a href="https://github.com/${esc(S.repo)}/actions/runs/${r.run_id}" target="_blank" rel="noopener">${r.run_id}</a>`, r.critical_path_s + 's', r.billable_job_s + 's']))}</div>`;
  }).join('') + `<div class="note">Read this honestly: ${m.experiments.some(e => e.summary.critical_path_s.permutation_p < 0.05 && e.summary.critical_path_s.median_diff_B_minus_A_s < 0) ? 'an opt-in workflow was faster on this one simple lint-then-test pipeline, and the gain depends on the removed gate being safe.' : ''} A result with p above 0.05 is not a detected difference. The default proposal changes no timing by design. These are one workflow with six to seven runs per arm and no failing run; replayed on the history of nine mature repositories the same lever saves about 0% (<a href="#evidence">Evidence</a>). It is evidence that the method can shorten a pipeline, not that it speeds up CI in general.</div>`;
}

/* ------------------------------------------------------------------ what-if */
async function pageWhatIf(d) {
  let f;
  try { f = await api(`/files?repo=${encodeURIComponent(S.repo)}`); } catch (e) { f = { available: false }; }
  if (!f.available) {
    return `<div class="panel"><h3>Preparing the models for what-if scoring</h3><div class="hint">The trained models and graph are kept in memory; after a server restart they are rebuilt once (the result itself came from the disk cache).</div><div class="bar"><div id="wiBar" style="width:5%"></div></div><div id="wiMsg" class="hint">starting...</div></div>`;
  }
  return `<div class="grid2"><div class="panel"><h3>1. Choose the changed files</h3><div class="hint">Search the repository's ${f.total} files, click to add, or use a ready-made scenario built from files that really exist here.</div>
      <input type="search" id="wiSearch" placeholder="search a path, e.g. lock, tests/, .github/workflows" autocomplete="off"><div class="filelist" id="wiFiles"></div>
      <div class="chips" id="wiScen">${f.suggestions.map((s, i) => `<button class="btn small" data-i="${i}">${esc(s.label)}</button>`).join('')}<button class="btn small" id="wiReal">The real diff (${f.real_diff.length} files)</button></div>
      <div class="hint" style="margin:10px 0 0">Selected files</div><div class="chips" id="wiChips"></div><button class="btn primary" id="wiRun">Score these files</button></div>
    <div class="panel"><h3>What this shows</h3><ul class="list"><li>Impacted jobs according to the dependency graph (conservative: jobs without file evidence count as impacted).</li>
      <li>The three models re-scored for the files you pick, next to the scores for the real diff of the latest run.</li>
      <li>The estimated plan and timeline for the new scores.</li>
      <li>Honest limit: only the structural features react to the files; history features do not. Graph features are informative where the workflow gates on paths (see <a href="#docs/GRAPH_FEATURES.md">graph features</a>).</li></ul></div></div>
    <div id="wiOut"></div>`;
}
PAGES.source[2] = wireSourceExplorer;
PAGES.whatif[2] = async function whatIfWire() {
  if (!$('wiSearch')) { // context not in memory yet: ask the server to rebuild it, then re-render the page
    const my = S.seq; await api(`/run?repo=${encodeURIComponent(S.repo)}&need_context=true`, { method: 'POST' });
    for (;;) { await new Promise(r => setTimeout(r, 700)); const st = await api(`/status?repo=${encodeURIComponent(S.repo)}`);
      if (my !== S.seq) return; if ($('wiBar')) { $('wiBar').style.width = Math.round(100 * Math.max(st.stage, 0) / st.stages.length) + '%'; $('wiMsg').textContent = st.stage_name || 'queued'; }
      if (st.state === 'error') { $('wiMsg').textContent = st.error; return; } if (st.state === 'done' && st.context_ready) { return route(); } }
  }
  const state = S.whatif;
  const files = await api(`/files?repo=${encodeURIComponent(S.repo)}`);
  const chips = () => { $('wiChips').innerHTML = state.files.length ? state.files.map((f, i) => `<span class="fchip">${esc(f)}<button data-i="${i}" title="remove">&times;</button></span>`).join('') : '<span class="hint">none yet</span>'; };
  const list = async () => { const r = await api(`/files?repo=${encodeURIComponent(S.repo)}&q=${encodeURIComponent($('wiSearch').value)}`); $('wiFiles').innerHTML = r.files.map(x => `<div data-f="${esc(x)}">${esc(x)}</div>`).join('') || '<div style="cursor:default">no match</div>'; };
  const add = (fs) => { fs.forEach(f => { if (!state.files.includes(f)) state.files.push(f); }); chips(); };
  $('wiSearch').oninput = list; list(); chips();
  $('wiFiles').onclick = (e) => { if (e.target.dataset.f) add([e.target.dataset.f]); };
  $('wiChips').onclick = (e) => { if (e.target.dataset.i !== undefined) { state.files.splice(+e.target.dataset.i, 1); chips(); } };
  $('wiScen').onclick = (e) => { if (e.target.dataset.i !== undefined) { state.files = files.suggestions[+e.target.dataset.i].files.slice(); chips(); runWhatIf(); } };
  $('wiReal').onclick = () => { state.files = files.real_diff.slice(0, 200); chips(); runWhatIf(); };
  $('wiRun').onclick = runWhatIf;
  if (state.data) $('wiOut').innerHTML = whatIfResult(state.data);
};
async function runWhatIf() {
  const out = $('wiOut'); if (!S.whatif.files.length) { out.innerHTML = '<div class="note">Pick at least one file.</div>'; return; }
  out.innerHTML = '<p class="hint">Scoring...</p>';
  try { S.whatif.data = await api('/whatif', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ repo: S.repo, changed_files: S.whatif.files }) }); out.innerHTML = whatIfResult(S.whatif.data); }
  catch (e) { out.innerHTML = `<div class="note">${esc(e.message)}</div>`; }
}
function whatIfResult(w) {
  const d = S.result, jobs = d.step1_repository.jobs, hot = new Set(w.impacted_jobs), s = w.summary, b = w.base_summary;
  const dur = {}; w.jobs.forEach(j => dur[j.job_id] = j.whatif.duration); const tl = timeline(jobs, dur, w.impacted_jobs);
  const arrow = (a, c, digits = 3) => (a === null || a === undefined || c === null || c === undefined) ? 'n/a' : `${a.toFixed(digits)} &rarr; <b>${c.toFixed(digits)}</b>`;
  return `<div class="panel"><h3>Result for ${w.changed_files.length} changed file${w.changed_files.length === 1 ? '' : 's'}</h3><div class="hint">${esc(w.changed_files.slice(0, 6).join(', '))}${w.changed_files.length > 6 ? ' ...' : ''}${w.unknown_files.length ? ` - not in the repository tree: ${esc(w.unknown_files.join(', '))}` : ''}</div>
    <div class="kpis" style="margin-bottom:0"><div class="kpi"><div class="label">Impacted jobs</div><div class="value v-accent">${w.impacted_jobs.length} / ${w.jobs.length}</div><div class="sub">${esc(w.impacted_jobs.join(', ') || 'none')}</div></div>
      <div class="kpi"><div class="label">Cache keys touched</div><div class="value v-cyan">${w.cache_keys_touched.length}</div><div class="sub" title="${esc(w.cache_keys_touched.join(' | '))}">${esc(w.cache_keys_touched.map(k => k.length > 44 ? k.slice(0, 43) + '...' : k).join(', ') || 'none')}</div></div>
      <div class="kpi"><div class="label">Wall-clock (est.)</div><div class="value">${s.baseline_wall_clock}s</div><div class="sub">real diff: ${b.baseline_wall_clock}s</div></div>
      <div class="kpi"><div class="label">Saved (est.)</div><div class="value ${s.time_saved_pct > 0 ? 'v-green' : 'v-amber'}">${s.time_saved_pct}%</div><div class="sub">default plan, ESTIMATED</div></div></div></div>
    <div class="panel"><h3>Jobs: real diff &rarr; your files</h3>${dagSvg(jobs, { cls: j => hot.has(j) ? 'hot' : 'cold', sub: j => { const x = w.jobs.find(y => y.job_id === j); return scoreWord() + ' ' + x.base.failure.toFixed(2) + ' -> ' + x.whatif.failure.toFixed(2); } })}
      <div class="legend"><span><i style="background:#ffe9c4"></i>impacted</span><span><i style="background:#f1f4f9"></i>not reached</span></div>
      ${table(['Job', 'Impacted', scoreIsProb() ? 'P(failure)' : 'Failure risk score', 'Job base rate', 'Seen on unseen rows that scored like this', 'P(cache miss)', 'Duration (s)'], w.jobs.map(j => {
        const sl = j.whatif.failure_seen_like_this; const seen = sl && sl.available ? (sl.outside_range ? '<span class="tag red">above anything seen</span> ' : '') + `${pct(sl.observed_rate)} of ${sl.rows}` : 'n/a';
        return [`<span class="v-accent">${esc(j.job_id)}</span>`, j.impacted ? '<span class="tag amber">yes</span>' : '<span class="tag grey">no</span>', arrow(j.base.failure, j.whatif.failure),
          j.whatif.failure_base_rate === null ? 'n/a' : pct(j.whatif.failure_base_rate), seen, arrow(j.base.cache_miss, j.whatif.cache_miss), arrow(j.base.duration, j.whatif.duration, 1)]; }))}</div>
    <div class="panel"><h3>Estimated timeline for these files</h3><div class="hint">Critical path about ${Math.round(tl.total)} s; impacted jobs in orange.</div>${tl.html}</div>
    <div class="note info">${esc(w.note)}</div>`;
}

/* ------------------------------------------------------------------ evidence */
async function pageEvidence(d) {
  const e = await api(`/evidence?repo=${encodeURIComponent(S.repo)}`);
  if (!e.reports.length) return `<div class="note">No generated report has a row for ${esc(S.repo)}. Reports are written by the CLI (<code>eval-models</code>, <code>triage</code>, <code>replay-gates</code>, ...) into <code>docs/</code>.</div>`;
  return `<div class="note info">Every row below is copied from a report that a CLI command generated from real data (<code>docs/</code>); the dashboard computes nothing here. Intervals that include 0 mean "not distinguishable from no difference".</div>` +
    e.reports.map(r => `<div class="panel"><h3>${esc(r.title)} <a class="tag grey" href="#docs/${esc(r.report)}" style="text-decoration:none">${esc(r.report)}</a></h3>${r.tables.map(t => `<div class="hint" style="margin-top:10px">${esc(t.heading)}</div>${table(t.headers.map(esc), t.rows.map(row => row.map(c => mdInline(c))))}`).join('')}</div>`).join('');
}
async function pageLive() {
  const l = await api('/live');
  if (!l.ledgers.length) return '<div class="note">No live-scoring ledger found in <code>.gha_optimizer/live/</code>. Start one with <code>gha-optimizer live-score</code>.</div>';
  return `<div class="note info">Predictions in a ledger were written when a run was queued, before any of its jobs finished, and every line carries the hash of the previous one: editing a past prediction breaks the chain.</div>
    <div class="panel">${table(['Ledger', 'Entries', 'Scored runs', 'Skipped', 'Hash chain', 'First', 'Last'], l.ledgers.map(x => [esc(x.ledger), x.entries, x.scored_runs, x.skipped_runs, x.hash_chain_verified ? '<span class="tag green">verified</span>' : '<span class="tag red">BROKEN</span>', esc(x.first || 'n/a'), esc(x.last || 'n/a')]))}</div>
    <p class="hint">Outcomes and scores: <a href="#docs/LIVE_TEST.md">LIVE_TEST.md</a>. A live window of hours or days is a demonstration, not a significance test.</p>`;
}

/* ------------------------------------------------------------------ project reports (markdown viewer) */
function mdInline(s) { return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<i>$2</i>')
  .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, t, u) => /^(https?:|#)/.test(u) ? `<a href="${u}">${t}</a>` : (/\.md$/.test(u) ? `<a href="#docs/${u.split('/').pop()}">${t}</a>` : t)); }
function markdown(src) {
  const lines = src.replace(/\r/g, '').split('\n'); const out = []; let i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (l.startsWith('```')) { const buf = []; i++; while (i < lines.length && !lines[i].startsWith('```')) buf.push(lines[i++]); i++; out.push(`<pre class="code">${esc(buf.join('\n'))}</pre>`); continue; }
    const h = /^(#{1,4})\s+(.*)$/.exec(l); if (h) { out.push(`<h${h[1].length}>${mdInline(h[2])}</h${h[1].length}>`); i++; continue; }
    if (l.startsWith('|') && i + 1 < lines.length && /^\|?\s*:?-{3,}/.test(lines[i + 1])) {
      const cells = (x) => x.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim()); const head = cells(l); i += 2; const rows = [];
      while (i < lines.length && lines[i].startsWith('|')) rows.push(cells(lines[i++]));
      out.push(`<table><tr>${head.map(c => `<th>${mdInline(c)}</th>`).join('')}</tr>${rows.map(r => `<tr>${r.map(c => `<td>${mdInline(c)}</td>`).join('')}</tr>`).join('')}</table>`); continue; }
    if (/^\s*([-*]|\d+\.)\s+/.test(l)) { const ord = /^\s*\d+\./.test(l); const items = []; while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*([-*]|\d+\.)\s+/, ''));
      out.push(`<${ord ? 'ol' : 'ul'}>${items.map(x => `<li>${mdInline(x)}</li>`).join('')}</${ord ? 'ol' : 'ul'}>`); continue; }
    if (l.startsWith('>')) { out.push(`<blockquote>${mdInline(l.replace(/^>\s?/, ''))}</blockquote>`); i++; continue; }
    if (!l.trim()) { i++; continue; }
    const para = []; while (i < lines.length && lines[i].trim() && !/^(#{1,4}\s|```|\||>|\s*([-*]|\d+\.)\s)/.test(lines[i])) para.push(lines[i++]);
    out.push(`<p>${mdInline(para.join(' '))}</p>`);
  }
  return out.join('\n');
}
async function pageDocs(d, name) {
  const list = (await api('/docs')).docs;
  const cur = name || (list.includes('IMPROVEMENT_RESULTS.md') ? 'IMPROVEMENT_RESULTS.md' : list[0]);
  const body = cur ? markdown(await api('/docs/' + encodeURIComponent(cur))) : '<p class="hint">No reports found in docs/.</p>';
  return `<div class="docs-layout"><div class="docs-list">${list.map(n => `<a href="#docs/${esc(n)}" class="${n === cur ? 'active' : ''}">${esc(n)}</a>`).join('')}</div><div class="panel md">${body}</div></div>`;
}
