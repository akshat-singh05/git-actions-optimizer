<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Actions Optimizer — Live Demo</title>
    <meta name="description" content="Live demonstration of the GitHub Actions Performance Optimizer pipeline." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #f4f6fa;
            --surface: #ffffff;
            --surface2: #f1f4f9;
            --border: #dbe1ea;
            --text: #1a2333;
            --text-dim: #5a6578;
            --accent: #1f4fb4;
            --accent2: #1f4fb4;
            --accent-dim: #e4ecfb;
            --green: #15803d;
            --green-dim: #dcfce7;
            --red: #b42318;
            --red-dim: #fee4e2;
            --amber: #b45309;
            --amber-dim: #fef0c7;
            --cyan: #0e7490;
            --pink: #9d174d;
            --radius: 8px;
            --shadow: 0 1px 2px rgba(16, 24, 40, 0.05);
            --mono: 'JetBrains Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
        }

        /* Header */
        .header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            border-top: 3px solid var(--accent);
            padding: 14px 32px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand svg { flex-shrink: 0; }
        .brand h1 { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; color: var(--text); line-height: 1.2; }
        .brand .tagline { font-size: 12px; color: var(--text-dim); }
        .team { font-size: 12px; color: var(--text-dim); text-align: right; line-height: 1.5; }
        .team strong { color: var(--text); font-weight: 600; }

        /* Loading */
        .loading-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            gap: 18px;
        }
        .spinner {
            width: 36px; height: 36px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { color: var(--text-dim); font-size: 13px; }

        /* Main */
        html, body { height: 100%; }
        body { overflow: hidden; }
        .app { height: 100vh; display: grid; grid-template-rows: auto minmax(0, 1fr); }
        .main { min-height: 0; overflow: hidden; }

        .context-bar {
            display: flex; flex-wrap: wrap; gap: 8px 28px;
            background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 12px 18px; margin-bottom: 20px; box-shadow: var(--shadow);
            font-size: 12px; color: var(--text-dim);
        }
        .context-bar b { color: var(--text); font-weight: 600; font-family: var(--mono); font-size: 12px; }

        /* Summary cards */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 14px;
            margin-bottom: 24px;
        }
        .summary-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 18px;
            box-shadow: var(--shadow);
        }
        .summary-card .label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-dim);
            margin-bottom: 6px;
        }
        .summary-card .value {
            font-size: 26px;
            font-weight: 700;
            font-family: var(--mono);
            letter-spacing: -0.02em;
        }
        .summary-card .sub { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
        .val-green { color: var(--green); }
        .val-accent { color: var(--accent); }
        .val-cyan { color: var(--cyan); }
        .val-amber { color: var(--amber); }
        .val-pink { color: var(--pink); }

        /* Steps */
        .step {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 14px;
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        .step-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 13px 18px;
            cursor: pointer;
            user-select: none;
            transition: background 0.15s;
        }
        .step-header:hover { background: var(--surface2); }
        .step-num {
            background: var(--accent);
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            width: 26px; height: 26px;
            border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .step-title { font-weight: 600; font-size: 14px; flex: 1; }
        .step-badge {
            font-size: 11px; padding: 3px 10px; border-radius: 999px;
            font-family: var(--mono); font-weight: 500;
        }
        .badge-pass { background: var(--green-dim); color: var(--green); }
        .badge-info { background: var(--accent-dim); color: var(--accent); }
        .badge-red { background: var(--red-dim); color: var(--red); }
        .chevron {
            transition: transform 0.2s;
            color: var(--text-dim);
            font-size: 10px;
        }
        .step.open .chevron { transform: rotate(90deg); }
        .step-body {
            display: none;
            padding: 4px 18px 18px;
            border-top: 1px solid var(--border);
        }
        .step.open .step-body { display: block; }

        /* Tables */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            margin-top: 12px;
            border: 1px solid var(--border);
        }
        th {
            text-align: left;
            padding: 8px 12px;
            background: var(--surface2);
            color: var(--text-dim);
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        td {
            padding: 8px 12px;
            border-top: 1px solid var(--border);
            font-family: var(--mono);
            font-size: 12px;
        }
        tr:hover td { background: #f8fafc; }

        /* Misc */
        .tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-family: var(--mono);
            font-weight: 500;
        }
        .tag-green { background: var(--green-dim); color: var(--green); }
        .tag-amber { background: var(--amber-dim); color: var(--amber); }
        .tag-red { background: var(--red-dim); color: var(--red); }
        .tag-blue { background: var(--accent-dim); color: var(--accent); }

        .edge-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 6px;
            margin-top: 10px;
        }
        .edge-item {
            font-family: var(--mono);
            font-size: 12px;
            padding: 6px 10px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-dim);
        }
        .edge-item .arrow { color: var(--accent); margin: 0 6px; }
        .edge-item .etype { color: var(--cyan); }

        .bar-chart { margin-top: 10px; }
        .bar-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }
        .bar-label {
            width: 200px;
            font-family: var(--mono);
            font-size: 12px;
            color: var(--text-dim);
            text-align: right;
            flex-shrink: 0;
        }
        .bar-track {
            flex: 1;
            height: 14px;
            background: var(--surface2);
            border-radius: 3px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 3px;
            transition: width 0.6s ease;
        }
        .bar-value {
            width: 60px;
            font-family: var(--mono);
            font-size: 12px;
            color: var(--text);
        }

        .dag-visual {
            font-family: var(--mono);
            font-size: 13px;
            padding: 14px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            line-height: 1.8;
            margin-top: 10px;
        }
        .dag-visual .node { color: var(--accent); font-weight: 600; }
        .dag-visual .arrow-sym { color: var(--green); }

        .diff-block {
            font-family: var(--mono);
            font-size: 12px;
            background: #f8fafc;
            color: var(--text);
            border: 1px solid var(--border);
            padding: 14px 16px;
            border-radius: 6px;
            overflow-x: auto;
            white-space: pre;
            line-height: 1.6;
            margin-top: 10px;
            max-height: 400px;
            overflow-y: auto;
        }
        .diff-add { color: #116329; background: #e6f4ea; }
        .diff-del { color: #a4161a; background: #fdecea; }
        .diff-hdr { color: #1f4fb4; }

        .section-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-top: 18px;
            margin-bottom: 6px;
        }

        .two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-top: 14px;
        }
        @media (max-width: 800px) {
            .two-col { grid-template-columns: 1fr; }
            .summary-grid { grid-template-columns: repeat(2, 1fr); }
            .header-inner { flex-direction: column; align-items: flex-start; gap: 8px; }
            .team { text-align: left; }
            .main { padding: 16px; }
        }

        .compact-card {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 14px;
        }
        .compact-card h4 {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text);
        }
        .kv { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; padding: 3px 0; }
        .kv .k { color: var(--text-dim); }
        .kv .v { font-family: var(--mono); color: var(--text); text-align: right; word-break: break-all; }

        .check {
            display: flex; align-items: center; gap: 10px; padding: 10px 12px;
            background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; font-size: 13px;
        }
        .check .mark {
            width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 700; color: #fff;
        }
        .check .mark.ok { background: var(--green); }
        .check .mark.bad { background: var(--red); }

        .note {
            margin-top: 16px; padding: 12px 14px; background: var(--amber-dim); border: 1px solid #f5d98a;
            border-radius: 6px; font-size: 12px; color: #5c3b06; line-height: 1.7;
        }

        /* Sidebar + pages */
.layout { display: grid; grid-template-columns: 248px minmax(0, 1fr); height: 100%; }
        .sidebar {
            background: var(--surface); border-right: 1px solid var(--border);
            padding: 12px 10px; overflow-y: auto; min-height: 0;
        }
        .nav-heading {
            font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px;
            color: var(--text-dim); padding: 6px 10px 8px;
        }
        .nav-link {
            display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px;
            font-size: 13px; color: var(--text); text-decoration: none; border-left: 3px solid transparent;
        }
        .nav-link:hover { background: var(--surface2); }
        .nav-link.active { background: var(--accent-dim); color: var(--accent); font-weight: 600; border-left-color: var(--accent); }
        .nav-num {
            width: 22px; height: 22px; border-radius: 5px; flex-shrink: 0; background: var(--surface2); color: var(--text-dim);
            font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center;
        }
        .nav-link.active .nav-num { background: var(--accent); color: #fff; }

        .page { min-width: 0; min-height: 0; overflow-y: auto; padding: 22px 28px 40px; }
        .page-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
        .page-head h2 { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; flex: 1; }
        .page > .two-col:first-of-type, .page > table:first-of-type { margin-top: 0; }
        .page-body-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }

        .index-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; margin-top: 8px; }
        .index-card {
            display: flex; align-items: center; gap: 12px; padding: 12px 14px; text-decoration: none; color: var(--text);
            background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow);
        }
        .index-card:hover { border-color: var(--accent); }
        .index-text { display: flex; flex-direction: column; min-width: 0; font-size: 13px; }
        .index-text span { font-size: 11px; color: var(--text-dim); font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .pager { display: flex; justify-content: space-between; margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--border); }
        .pager a { font-size: 13px; font-weight: 600; color: var(--accent); text-decoration: none; padding: 8px 14px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); }
        .pager a:hover { border-color: var(--accent); }

        @media (max-width: 900px) {
            body { overflow: auto; }
            .app { height: auto; }
            .layout { grid-template-columns: 1fr; height: auto; }
            .sidebar { display: flex; flex-wrap: wrap; gap: 4px; border-right: 0; border-bottom: 1px solid var(--border); }
            .nav-heading { width: 100%; }
            .page { overflow: visible; padding: 16px; }
        }

        /* Header repository switch */
        .repo-switch { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-dim); }
        .repo-switch select {
            font: inherit; font-size: 13px; font-weight: 600; color: var(--text); background: var(--surface);
            border: 1px solid var(--border); border-radius: 6px; padding: 7px 28px 7px 10px; min-width: 260px; cursor: pointer;
        }
        .repo-switch select:focus { outline: 2px solid var(--accent-dim); border-color: var(--accent); }
        .repo-state { font-family: var(--mono); font-size: 11px; padding: 3px 8px; border-radius: 999px; background: var(--surface2); }

        /* Dashboard panels and charts */
        .dash-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-bottom: 14px; }
        .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; min-width: 0; }
        .panel.full { grid-column: 1 / -1; }
        .panel h3 { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
        .panel .hint { font-size: 11px; color: var(--text-dim); margin-bottom: 12px; }
        .hbar { display: grid; grid-template-columns: 190px minmax(0, 1fr) 64px; align-items: center; gap: 10px; margin-bottom: 7px; font-size: 12px; }
        .hbar .name { font-family: var(--mono); color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .hbar .track { height: 12px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
        .hbar .fill { height: 100%; border-radius: 3px; background: var(--accent); }
        .hbar .fill.g { background: #22a055; } .hbar .fill.a { background: #d9831f; } .hbar .fill.r { background: #d1432f; }
        .hbar .num { font-family: var(--mono); text-align: right; color: var(--text-dim); }
        .gantt { position: relative; }
        .g-row { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 10px; align-items: center; margin-bottom: 6px; font-size: 12px; }
        .g-row .name { font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .g-lane { position: relative; height: 18px; background: var(--surface2); border-radius: 3px; }
        .g-bar { position: absolute; top: 0; height: 100%; background: var(--accent); border-radius: 3px; min-width: 2px; color: #fff; font-size: 10px; font-family: var(--mono); display: flex; align-items: center; padding-left: 5px; overflow: hidden; white-space: nowrap; }
        .g-axis { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 10px; margin-top: 4px; font-size: 10px; color: var(--text-dim); font-family: var(--mono); }
        .g-axis div:last-child { display: flex; justify-content: space-between; }
        .status-list { list-style: none; font-size: 12px; color: var(--text); line-height: 1.6; }
        .status-list li { padding: 5px 0; border-top: 1px solid var(--border); }
        .status-list li:first-child { border-top: 0; }
        .pill { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: 0.4px; padding: 1px 7px; border-radius: 999px; margin-right: 6px; }
        .pill.est { background: var(--amber-dim); color: var(--amber); }
        .pill.meas { background: var(--green-dim); color: var(--green); }
        @media (max-width: 1000px) { .dash-grid { grid-template-columns: 1fr; } }
        @media (min-width: 1300px) { .summary-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); } }

        .footer {
            text-align: center;
            padding: 24px;
            color: var(--text-dim);
            font-size: 12px;
            border-top: 1px solid var(--border);
            margin-top: 32px;
        }
    </style>
</head>
<body>
    <div class="app">
    <div class="header">
        <div class="header-inner">
            <div class="brand">
                <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">
                    <rect width="32" height="32" rx="7" fill="#1f4fb4"/>
                    <circle cx="9" cy="16" r="2.6" fill="#fff"/><circle cx="23" cy="9" r="2.6" fill="#fff"/><circle cx="23" cy="23" r="2.6" fill="#fff"/>
                    <path d="M11.4 15.2 20.6 10M11.4 16.8 20.6 22" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/>
                </svg>
                <div>
                    <h1>GitHub Actions Performance Optimizer</h1>
                    <div class="tagline">Dependency-aware, prediction-driven CI/CD scheduling</div>
                </div>
            </div>
            <div class="repo-switch">
                <label for="repoSelect">Repository</label>
                <select id="repoSelect" aria-label="Repository"></select>
                <span class="repo-state" id="repoState"></span>
            </div>
            <div class="team">
                <strong>Akshat Singh</strong> 23BKT0005 &nbsp;&middot;&nbsp; <strong>Aditya Choubey</strong> 23BCE2274<br>
                B.Tech CSE capstone (BCSE497J), VIT
            </div>
        </div>
    </div>

    <div class="main" id="content">
        <div class="loading-screen" id="loading">
            <div class="spinner"></div>
            <div class="loading-text">Running full pipeline… Repository → Graph → Fusion → ML → Scheduler → YAML</div>
        </div>
    </div>
    </div>

    <script>
    const params = new URLSearchParams(location.search);
    let currentRepo = params.get('repo');

    function setLoading(msg) {
        document.getElementById('content').innerHTML = `
            <div class="loading-screen" id="loading"><div class="spinner"></div>
            <div class="loading-text">${msg}</div></div>`;
    }

    async function initRepos() {
        const sel = document.getElementById('repoSelect');
        try {
            const info = await (await fetch('/api/repos')).json();
            currentRepo = currentRepo || info.default || (info.repos[0] && info.repos[0].repo);
            sel.innerHTML = info.repos.map(r =>
                `<option value="${escapeHtml(r.repo)}"${r.repo === currentRepo ? ' selected' : ''}>${escapeHtml(r.repo)} — ${r.runs} runs${r.declined ? ' (declines)' : r.ready ? ' ✓' : ''}</option>`).join('');
            sel.onchange = () => {
                currentRepo = sel.value;
                const q = new URLSearchParams(location.search); q.set('repo', currentRepo);
                history.replaceState(null, '', '?' + q.toString() + location.hash);
                loadDemo();
            };
        } catch (e) { /* the page still works for the default repository */ }
        loadDemo();
    }

    async function loadDemo() {
        const state = document.getElementById('repoState');
        state.textContent = 'running pipeline…';
        setLoading('Running the full pipeline on <b>' + escapeHtml(currentRepo || 'the default repository') + '</b> — ' +
                   'Repository → Graph → Fusion → ML → Scheduler → YAML. A repository that has not been run yet can take up to a minute.');
        try {
            const res = await fetch('/api/demo' + (currentRepo ? '?repo=' + encodeURIComponent(currentRepo) : ''));
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();
            state.textContent = data.declined ? 'declined (not enough real history)' : 'ready';
            renderDashboard(data);
        } catch (e) {
            state.textContent = 'error';
            document.getElementById('content').innerHTML = `
                <div class="loading-screen"><div style="color:var(--red); font-size:14px;">Failed to load: ${escapeHtml(e.message)}</div>
                <div style="color:var(--text-dim); font-size:12px;">Make sure demo_server.py is running on port 8501</div></div>`;
        }
    }

    function dashboardHtml(d) {
        const s = d.summary, jobs = d.step1_repository.jobs, pred = d.step7_models.predictions;
        const ids = Object.keys(jobs);
        const maxDur = Math.max(...ids.map(j => pred[j].duration), 1);
        const durBars = ids.slice().sort((a, b) => pred[b].duration - pred[a].duration).map(j => `
            <div class="hbar"><div class="name" title="${j}">${j}</div>
            <div class="track"><div class="fill" style="width:${(pred[j].duration / maxDur * 100).toFixed(1)}%"></div></div>
            <div class="num">${pred[j].duration}s</div></div>`).join('');

            const p = pred[j].failure, c = p > 0.5 ? 'r' : p > 0.2 ? 'a' : 'g';
            return `<div class="hbar"><div class="name" title="${j}">${j}</div>
            <div class="track"><div class="fill ${c}" style="width:${Math.max(p * 100, 1).toFixed(1)}%"></div></div>
            <div class="num">${p.toFixed(3)}</div></div>`;
        }).join('');

        // Estimated timeline: each job starts when every `needs` job has finished (unlimited concurrency, predicted durations)
        const end = {};
        const finish = j => end[j] !== undefined ? end[j] : (end[j] = Math.max(0, ...(jobs[j].needs || []).filter(n => jobs[n]).map(finish)) + pred[j].duration);
        ids.forEach(finish);
        const total = Math.max(...ids.map(j => end[j]), 1);
        const rows = ids.slice().sort((a, b) => (end[a] - pred[a].duration) - (end[b] - pred[b].duration)).map(j => {
            const st = end[j] - pred[j].duration;
            return `<div class="g-row"><div class="name" title="${j}">${j}</div><div class="g-lane">
                <div class="g-bar" style="left:${(st / total * 100).toFixed(2)}%;width:${(pred[j].duration / total * 100).toFixed(2)}%">${pred[j].duration}s</div></div></div>`;

            ? 'The scheduler found an estimated wall-clock saving for this workflow (from predicted durations).'

    // Each feature becomes its own page (sidebar entry + #step-N route); renderStep only registers it.
    let pages = [];
    function renderStep(num, title, badge, badgeClass, open, body) {
        pages.push({id: 'step-' + num, num, title, badge, badgeClass, body});
        return '';
    }

    function renderModelCard(name, m) {
        const trained = m.status === 'TRAINED';
        return `<div class="compact-card">
            <h4>${name}</h4>
            <div class="kv"><span class="k">Status</span><span class="v"><span class="tag ${trained ? 'tag-green' : 'tag-amber'}">${m.status}</span></span></div>
            ${m.backend ? `<div class="kv"><span class="k">Backend</span><span class="v">${m.backend}</span></div>` : ''}
            ${m.validation ? `<div class="kv"><span class="k">Validation</span><span class="v">${m.validation}</span></div>` : ''}
            ${m.f1 !== undefined ? `<div class="kv"><span class="k">F1 Score</span><span class="v">${m.f1}</span></div>` : ''}
            ${m.roc_auc !== undefined ? `<div class="kv"><span class="k">ROC AUC</span><span class="v">${m.roc_auc}</span></div>` : ''}
            ${m.r2 !== undefined ? `<div class="kv"><span class="k">R²</span><span class="v">${m.r2}</span></div>` : ''}
            ${m.mae_seconds !== undefined ? `<div class="kv"><span class="k">MAE</span><span class="v">${m.mae_seconds}s</span></div>` : ''}
        </div>`;
    }

    function renderCheck(label, ok) {
        return `<div class="check">
            <span class="mark ${ok ? 'ok' : 'bad'}">${ok ? '&#10003;' : '&times;'}</span>
            <span>${label}</span>
        </div>`;
    }

    function renderProb(p) {
        let cls = 'tag-green';
        if (p > 0.5) cls = 'tag-red';
        else if (p > 0.2) cls = 'tag-amber';
        return `<span class="tag ${cls}">${p.toFixed(4)}</span>`;
    }

    function shortEdge(t) {
        return t.replace('EdgeType.', '');
    }

    function escapeHtml(s) {
        return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function formatDiff(diff) {
        return diff.split('\n').map(line => {
            const esc = escapeHtml(line);
            if (line.startsWith('+++') || line.startsWith('---')) return `<span class="diff-hdr">${esc}</span>`;
            if (line.startsWith('@@')) return `<span class="diff-hdr">${esc}</span>`;
            if (line.startsWith('+')) return `<span class="diff-add">${esc}</span>`;
            if (line.startsWith('-')) return `<span class="diff-del">${esc}</span>`;
            return esc;
        }).join('\n');
    }

    initRepos();
    </script>
</body>
</html>
