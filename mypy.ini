# Type-check configuration; CI runs `mypy gha_optimizer/ --ignore-missing-imports` (non-blocking), which picks this file up.
[mypy]
python_version = 3.10
ignore_missing_imports = True

# The SQLAlchemy models (gha_optimizer/server/db/models.py) use the legacy `Column(...)` declarations, which a type checker sees as `Column[T]` on
# instances, so every read / write of an ORM attribute in the modules below is reported as a type error although it is correct at runtime (the
# tests exercise all of them).  Migrating the ~35 model classes to `Mapped[T] = mapped_column(...)` would remove the need for these entries; it is a
# separate refactor and is listed in docs/PROJECT_STATUS.md.  Only the error kinds that this typing gap produces are disabled, and only in the modules
# that touch ORM attributes; every other module is checked in full.
[mypy-gha_optimizer.ingestion.ingest,gha_optimizer.ingestion.history,gha_optimizer.features.dataset_report,gha_optimizer.features.graph_features,gha_optimizer.triage,gha_optimizer.replay,gha_optimizer.gate_replay,gha_optimizer.server.db.crud,gha_optimizer.graph.storage]
disable_error_code = assignment, arg-type, index, call-overload, return-value, misc, union-attr, attr-defined, dict-item
